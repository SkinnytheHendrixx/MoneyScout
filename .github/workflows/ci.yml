name: Money Scout CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: money_scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d money_scout_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_scout_test
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run zero-cost Research tests
        run: pnpm --filter @workspace/api-server run test:zero-cost

      - name: Run zero-cost Discovery fixture tests
        run: pnpm --filter @workspace/api-server run test:zero-cost-discovery

      - name: Run database-backed Discovery API tests
        run: pnpm --filter @workspace/api-server run test:zero-cost-discovery-api
