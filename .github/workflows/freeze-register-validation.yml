name: Freeze Register Validation

on:
  push:
    paths:
      - 'scripts/audit/materialize_freeze_register.py'
      - 'scripts/audit/materialize_freeze_register_v2.py'
      - 'scripts/audit/materialize_freeze_register_v3.py'
      - 'scripts/audit/materialize_freeze_register_v4.py'
      - '.github/workflows/freeze-register-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize normalized freeze register
        run: python scripts/audit/materialize_freeze_register_v4.py

      - name: Verify generated artifact exists and is valid JSON
        run: |
          test -s docs/remediation-contracts/GLOBAL_REMEDIATION_REGISTER_FREEZE_ASSEMBLY.json
          python -m json.tool docs/remediation-contracts/GLOBAL_REMEDIATION_REGISTER_FREEZE_ASSEMBLY.json >/dev/null

      - name: Assert zero validation errors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/remediation-contracts/GLOBAL_REMEDIATION_REGISTER_FREEZE_ASSEMBLY.json')
          data = json.loads(p.read_text())
          v = data['validation']
          assert v['error_count'] == 0, v
          assert v['structural_error_count'] == 0, v
          assert v['fidelity_error_count'] == 0, v
          assert v['assembly_completeness_error_count'] == 0, v
          assert v['canonicalization_error_count'] == 0, v
          assert v['row_count'] == 155, v
          assert v['edge_count'] == 117, v
          assert data['phase_h_source_state_arithmetic'] == {
              'SOURCE_EXHAUSTED': 0,
              'SOURCE_NOT_YET_EXHAUSTED': 7,
              'SOURCE_PARTIALLY_EXHAUSTED': 46,
              'SOURCE_AVAILABILITY_UNRESOLVED': 4,
          }
          assert data['phase_j_disposition_arithmetic'] == {
              'J_ENFORCED': 0,
              'J_PARTIALLY_ENFORCED': 0,
              'J_DOCUMENTED_ONLY': 3,
              'J_MISSING': 3,
          }
          assert data['status'] == 'MATERIALIZED_FREEZE_ASSEMBLY_V4_REVIEW_DRAFT'
          print(json.dumps(v, indent=2))
          PY

      - name: Upload materialized register
        uses: actions/upload-artifact@v4
        with:
          name: money-scout-freeze-register-assembly-v4
          path: docs/remediation-contracts/GLOBAL_REMEDIATION_REGISTER_FREEZE_ASSEMBLY.json
          if-no-files-found: error
          retention-days: 30
