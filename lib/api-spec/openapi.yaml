openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Money Scout API
servers:
  - url: /api
tags:
  - name: health
  - name: opportunities
  - name: evidence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getOpportunity
      tags: [opportunities]
      responses:
        "200":
          description: Opportunity with evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDetail"
        "404":
          description: Not found
    patch:
      operationId: updateOpportunity
      tags: [opportunities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
    delete:
      operationId: deleteOpportunity
      tags: [opportunities]
      responses:
        "204":
          description: Deleted
  /opportunities/{opportunityId}/evidence:
    parameters:
      - name: opportunityId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listEvidence
      tags: [evidence]
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: createEvidence
      tags: [evidence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
  /opportunities/{opportunityId}/policy-checks:
    parameters:
      - name: opportunityId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listPolicyChecks
      tags: [opportunities]
      responses:
        "200":
          description: Policy check history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyCheck"
    post:
      operationId: runPolicyCheck
      tags: [opportunities]
      responses:
        "201":
          description: Completed policy check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCheck"
        "404":
          description: Opportunity not found
        "409":
          description: Policy check already running
  /opportunities/{opportunityId}/demand-checks:
    parameters:
      - name: opportunityId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listDemandChecks
      tags: [opportunities]
      responses:
        "200":
          description: Demand Check history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemandCheckResult"
    post:
      operationId: runDemandCheck
      tags: [opportunities]
      responses:
        "201":
          description: Completed Demand Check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandCheckResult"
        "404":
          description: Opportunity not found
        "409":
          description: Demand Check already running
        "503":
          description: AI research integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIIntegrationUnavailable"
  /evidence/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEvidence
      tags: [evidence]
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
    patch:
      operationId: updateEvidence
      tags: [evidence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      responses:
        "204":
          description: Deleted
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    PolicyStatus:
      type: string
      enum: [GREEN, YELLOW, RED, UNKNOWN]
    Verdict:
      type: string
      enum: [NEW, RESEARCH, WATCH, TEST, BUILD, KILL]
    EvidenceClassification:
      type: string
      enum: [FACT, CLAIM, INFERENCE, UNKNOWN]
    Opportunity:
      type: object
      required: [id, name, source_platform, source_url, opportunity_type, thesis, first_seen, last_researched, status, overall_score, policy_status, verdict, kill_reason, engine_family]
      properties:
        id: { type: integer }
        name: { type: string }
        source_platform: { type: string }
        source_url: { type: string, format: uri }
        opportunity_type: { type: string }
        thesis: { type: string }
        first_seen: { type: string, format: date }
        last_researched: { type: string, format: date }
        status: { type: string }
        overall_score: { type: number }
        policy_status: { $ref: "#/components/schemas/PolicyStatus" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        kill_reason: { type: [string, "null"] }
        engine_family: { type: string }
    OpportunityInput:
      type: object
      required: [name, source_platform, source_url, opportunity_type, thesis, first_seen, last_researched, status, overall_score, policy_status, verdict, engine_family]
      properties:
        name: { type: string, minLength: 1 }
        source_platform: { type: string, minLength: 1 }
        source_url: { type: string, format: uri }
        opportunity_type: { type: string, minLength: 1 }
        thesis: { type: string, minLength: 1 }
        first_seen: { type: string, format: date }
        last_researched: { type: string, format: date }
        status: { type: string, minLength: 1 }
        overall_score: { type: number }
        policy_status: { $ref: "#/components/schemas/PolicyStatus" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        kill_reason: { type: [string, "null"] }
        engine_family: { type: string, minLength: 1 }
    OpportunityUpdate:
      allOf:
        - $ref: "#/components/schemas/OpportunityInput"
    OpportunityDetail:
      allOf:
        - $ref: "#/components/schemas/Opportunity"
        - type: object
          required: [evidence]
          properties:
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
    Evidence:
      type: object
      required: [id, claim, source_url, source_title, observed_date, classification, opportunity_id, evaluation_dimension]
      properties:
        id: { type: integer }
        claim: { type: string }
        source_url: { type: string, format: uri }
        source_title: { type: string }
        observed_date: { type: string, format: date }
        classification: { $ref: "#/components/schemas/EvidenceClassification" }
        opportunity_id: { type: integer }
        evaluation_dimension: { type: string }
    EvidenceInput:
      type: object
      required: [claim, source_url, source_title, observed_date, classification, evaluation_dimension]
      properties:
        claim: { type: string, minLength: 1 }
        source_url: { type: string, format: uri }
        source_title: { type: string, minLength: 1 }
        observed_date: { type: string, format: date }
        classification: { $ref: "#/components/schemas/EvidenceClassification" }
        evaluation_dimension: { type: string, minLength: 1 }
    EvidenceUpdate:
      type: object
      required: [claim, source_url, source_title, observed_date, classification, opportunity_id, evaluation_dimension]
      properties:
        claim: { type: string, minLength: 1 }
        source_url: { type: string, format: uri }
        source_title: { type: string, minLength: 1 }
        observed_date: { type: string, format: date }
        classification: { $ref: "#/components/schemas/EvidenceClassification" }
        opportunity_id: { type: integer }
        evaluation_dimension: { type: string, minLength: 1 }
    PolicyCheck:
      type: object
      required: [id, opportunity_id, status, summary, checked_at, retrieval_method, evidence_created, external_cost_usd, ai_input_tokens, ai_output_tokens]
      properties:
        id: { type: integer }
        opportunity_id: { type: integer }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        summary: { type: string }
        checked_at: { type: string, format: date-time }
        retrieval_method:
          type: string
          enum: [HTTP, HTTP_AND_WEB_SEARCH, HTTP_AND_BROWSERBASE, HTTP_INSUFFICIENT]
        evidence_created: { type: integer }
        external_cost_usd: { type: [number, "null"] }
        ai_input_tokens: { type: [integer, "null"] }
        ai_output_tokens: { type: [integer, "null"] }
    DemandConclusion:
      type: string
      enum: [SUPPORTED, WEAK, UNSUPPORTED, UNKNOWN]
    DemandTriState:
      type: string
      enum: ["true", "false", unknown]
    DemandCheckResult:
      type: object
      required:
        - id
        - opportunity_id
        - run_id
        - buyer_identified
        - buyer_description
        - workflow_identified
        - workflow_description
        - access_vs_consumption
        - recurring_usage_signal
        - recurring_usage_basis
        - existing_paid_analog_found
        - paid_analog_names
        - demand_conclusion
        - contradicting_evidence_ids
        - confidence_basis
        - open_questions
        - search_count
        - claude_call_count
        - external_cost_usd
        - ai_input_tokens
        - ai_output_tokens
        - started_at
        - finished_at
      properties:
        id: { type: integer }
        opportunity_id: { type: integer }
        run_id: { type: integer }
        buyer_identified: { $ref: "#/components/schemas/DemandTriState" }
        buyer_description: { type: [string, "null"] }
        workflow_identified: { $ref: "#/components/schemas/DemandTriState" }
        workflow_description: { type: [string, "null"] }
        access_vs_consumption:
          type: string
          enum: [access_demand, consumption_only, unclear]
        recurring_usage_signal:
          type: string
          enum: [yes, no, unknown]
        recurring_usage_basis: { type: [string, "null"] }
        existing_paid_analog_found: { type: boolean }
        paid_analog_names:
          type: array
          items: { type: string }
        demand_conclusion: { $ref: "#/components/schemas/DemandConclusion" }
        contradicting_evidence_ids:
          type: array
          items: { type: integer }
        confidence_basis: { type: string }
        open_questions:
          type: array
          items: { type: string }
        search_count: { type: integer }
        claude_call_count: { type: integer }
        external_cost_usd: { type: number }
        ai_input_tokens: { type: integer }
        ai_output_tokens: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    AIIntegrationUnavailable:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [AI_INTEGRATION_UNAVAILABLE]
        message: { type: string }